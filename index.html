<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A14">
<title>اتاق ماینر میکو</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
/* ═══════════ DESIGN BRIEF «شب مایکو» — فاز ۱ ═══════════
   مود: اتاق زیرشیبانی گیمر در شب — گرم و شخصی، نه محیط سرد دیجیتال.
   نور: منبع اصلی نور مانیتور + تاکیدهای رنگ ارز؛ سایه‌ی تماس زیر هر آبجکت.
   متریال: چوب/MDF گرم (میز و قفسه) · فلز مات (ماینر) · پلاستیک (دسکتاپ).
   پالت: شبِ خنثیِ گرم + کرم؛ اکشن برند = مسی؛ هر ارز یک رنگ ثابت در همه‌جا.
   تایپ: Vazirmatn (۹۰۰/۸۰۰ تیترها) + اعداد همیشه tabular و فشرده.
   آیکون: گرید ۲۴ · خط ۱٫۸ · گوشه گرد · برخی دو‌رنگ؛ ایموجی ممنوع.
   حرکت: --e-out ورود/خروج · --e-spring لمس؛ ۱۸۰ تا ۳۲۰ میلی‌ثانیه. */
--bg0:#0B0A14;--bg1:#131022;--bg2:#1B1730;--bg3:#252040;
--txt:#F4EFE6;--mut:#A79FC4;--mut2:#7E76A0;
--line:rgba(244,239,230,.13);--line2:rgba(244,239,230,.22);
--brand:#E8913A;--brand2:#F5B356;--on-brand:#241304;
--c-star:#FFC247;--c-star-deep:#B97E14;
--c-ton:#3AA8F0;--c-ton-deep:#1E6FB0;
--c-usd:#3ED598;--c-usd-deep:#1D9E66;
--up:#4CD97B;--down:#FF5C7A;--warn:#FFC247;
--card:rgba(244,239,230,.045);--glass:rgba(19,16,34,.72);
--e-out:cubic-bezier(.2,.8,.2,1);--e-spring:cubic-bezier(.34,1.45,.4,1);
--t-fast:180ms;--t-med:240ms;--t-slow:320ms;
--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:26px;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
--z-nav:3;--z-scrim:9;--z-sheet:10;--z-toast:12;--z-float:30;
/* legacy (فاز ۲ به‌تدریج حذف می‌شن) */
--bg:var(--bg0);--p1:var(--bg1);--p2:var(--bg2);--neon:#8F7BD8;--cyan:#6FD3F2;--pink:var(--down);--green:var(--up);--gold:var(--c-star);--ton:var(--c-ton)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;height:100%;background:var(--bg);color:var(--txt);font-family:"Vazirmatn","Vazir","Tahoma","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
button:focus-visible,[role="button"]:focus-visible,a:focus-visible{outline:2px solid var(--brand2);outline-offset:3px}
a{color:var(--cyan)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mut{color:var(--mut)}
#app{height:100vh;height:100dvh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:radial-gradient(120% 60% at 80% 14%,#2A2148 0%,#16122B 48%,#0B0A14 100%)}

/* HUD */
#hud{padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:grid;gap:7px;position:relative;z-index:var(--z-nav)}
#hud .top{display:flex;align-items:flex-end;gap:12px}
#hud .box{min-width:0}
#hud .box.g{flex:1}
#hud small{display:block;font-size:10px;color:var(--mut);line-height:1.4;margin-bottom:1px}
#hud b{font-size:20px;font-weight:900;letter-spacing:.2px;line-height:1.25}
#bal{color:var(--c-star);text-shadow:0 0 16px rgba(255,194,71,.35);cursor:pointer}
#inc{font-size:13px!important;font-weight:800!important}
#bal.bump{animation:bump .9s var(--e-out)}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.12);color:#7dffb0;text-shadow:0 0 18px rgba(77,255,176,.8)}100%{transform:scale(1)}}
.flb{position:fixed;z-index:var(--z-float);font-weight:800;font-size:14px;color:#7dffb0;text-shadow:0 0 10px rgba(77,255,176,.7);pointer-events:none;animation:riseb 1.3s ease-out forwards;direction:ltr}
@keyframes riseb{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
#inc.pos{color:var(--up)}#inc.neg{color:var(--down)}
#tags{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--glass);white-space:nowrap}
.tag.on{color:var(--up);border-color:rgba(76,217,123,.45)}
.tag.on:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:pls 2.2s ease-in-out infinite}
.tag.off{color:var(--warn);border-color:rgba(255,194,71,.45)}
.tag.off:before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--warn)}
.tag.bst{color:#1a1004;background:linear-gradient(135deg,#ffd166,#ff9f43);border:0;font-weight:800;animation:pls 1s ease-in-out infinite}
.tag .ic{width:11px;height:11px}
.tag.hide{display:none}
@keyframes pls{50%{transform:scale(1.08)}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 8px;border-radius:var(--r-md);border:1px solid var(--line);background:linear-gradient(135deg,rgba(37,32,64,.75),rgba(19,16,34,.75));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;transition:border-color var(--t-fast),box-shadow var(--t-fast),transform .12s;min-width:0}
.chip:active{transform:scale(.97)}
.chip.sel{border-color:var(--c);box-shadow:0 0 12px var(--cg)}
.chip.flash{animation:chipf .55s var(--e-out)}
@keyframes chipf{35%{transform:scale(1.06);box-shadow:0 0 14px var(--cg)}}
.chip>div{min-width:0}
#hud .chip b{font-size:11.5px;font-weight:800;letter-spacing:0}
#hud .chip small{font-size:9px;margin:0}
.chip b{display:block;font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{display:block;font-size:10px;color:var(--mut)}
.ci{flex:none}

/* Scene */
#scene{flex:1;min-height:0;position:relative}
#room{width:100%;height:100%;display:block}
#room .tap{cursor:pointer}
#room .tap:active{opacity:.85}
.shake{animation:shake .12s}
@keyframes shake{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.rgb{animation:hue 5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.item{transition:opacity .9s ease}
.gone{opacity:0;pointer-events:none}
.plus{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.flick{animation:flick 5s steps(1,end) infinite}
@keyframes flick{0%,6%,9%,100%{opacity:1}7%{opacity:.35}8%{opacity:.8}52%{opacity:.55}53%{opacity:1}}
#fx{position:absolute;inset:0;pointer-events:none}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-weight:800;font-size:15px;animation:rise .95s ease-out forwards;text-shadow:0 0 8px currentColor;white-space:nowrap}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-52px);opacity:0}}
#taskBtn{position:absolute;top:10px;left:10px;z-index:var(--z-nav);width:44px;height:44px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--cyan)}
#taskBtn .ic{width:20px;height:20px}
#taskBtn:active{transform:scale(.94)}
#taskBtn .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#ff4f6a;border:2px solid var(--bg1);box-shadow:0 0 8px #ff4f6a;animation:pls 1.2s ease-in-out infinite}
#taskBtn .dot.hide{display:none}
#energy{position:absolute;top:10px;right:10px;z-index:var(--z-nav);display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;pointer-events:none;color:var(--txt)}
#energy .ic{width:15px;height:15px;color:var(--warn)}
#energy i{display:block;width:52px;height:7px;border-radius:9px;background:rgba(244,239,230,.14);overflow:hidden}
#energy b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c-ton),var(--c-star));border-radius:9px;transition:width .4s var(--e-out)}
#energy.empty{border-color:rgba(255,92,122,.6);animation:emptyP 1.2s ease-in-out infinite}
#energy.empty .ic{color:var(--down)}
@keyframes emptyP{50%{box-shadow:0 0 12px rgba(255,92,122,.55)}}
#toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);padding:8px 15px;border-radius:99px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:var(--z-toast)}
#toast.on{opacity:1}
#boost{position:absolute;z-index:4;border:0;border-radius:99px;padding:9px 15px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#1a1004;background:linear-gradient(135deg,#ffe08a,#ff9f43);box-shadow:0 0 22px rgba(255,170,60,.7);animation:pls 1s ease-in-out infinite;transition:opacity .3s}
#boost .ic{width:15px;height:15px}
#boost.hide{opacity:0;pointer-events:none}

/* Dialogue */
#bubble{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:10px;align-items:flex-end;transition:opacity .3s,transform .3s;pointer-events:none}
#bubble.hide{opacity:0;transform:translateY(10px)}
#bubble .bp{width:58px;height:70px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#bubble .bt{background:rgba(12,9,34,.94);border:1px solid var(--neon);border-radius:16px 16px 4px 16px;padding:10px 13px;font-size:13.5px;line-height:1.75;box-shadow:0 0 18px rgba(167,139,250,.3)}

/* Chibi */
.chibi{overflow:visible}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.mkhop{transform-box:fill-box}
#mk3.joy .mkhop{animation:mkhop .45s ease-in-out infinite}
@keyframes mkhop{50%{transform:translateY(-3.5px)}}
@keyframes bob{50%{transform:translateY(-2px)}}

/* Sheet (فاز ۲) — اورلی با سه snap: ۴۰٪ / ۷۵٪ / ۱۰۰٪ · درگ از هدر · scrim پشت صحنه */
#scrim{position:absolute;left:0;right:0;top:var(--hud-h,90px);bottom:calc(var(--nav-h,64px) + var(--kb,0px));background:rgba(7,6,16,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:var(--z-scrim)}
#app.sopen #scrim{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:calc(var(--nav-h,64px) + var(--kb,0px));height:calc(var(--area-h,60vh) - var(--kb,0px));display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 62%,var(--bg1) 100%);border:1px solid var(--line2);border-bottom:0;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -18px 44px rgba(0,0,0,.55);transform:translateY(110%);transition:transform var(--t-slow) var(--e-out);z-index:var(--z-sheet);visibility:hidden}
#sheet.open{visibility:visible}
#sheet.drag{transition:none}
#sheetHead{flex:none;padding:10px 14px 6px;display:grid;gap:9px;touch-action:none;cursor:grab}
#sheetHead:active{cursor:grabbing}
#sheetHead .grab{width:44px;height:5px;border-radius:9px;background:rgba(244,239,230,.25);margin:0 auto}
#sheetHead .hrow{display:flex;justify-content:space-between;align-items:center}
#sheetHead h2{margin:0;font-size:16px;font-weight:800}
#sheetHead button{background:none;border:0;color:var(--mut);padding:6px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
#sheetHead button:active{background:rgba(244,239,230,.08)}
#sheetHead button .ic{width:18px;height:18px}
#sheetBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 14px 16px;scrollbar-width:none}
#sheetBody::-webkit-scrollbar{display:none}
.hint{font-size:12px;color:var(--mut);margin:0 0 10px;line-height:1.8}
.sec{font-size:13px;margin:14px 0 8px;color:var(--cyan)}
.row{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}
.row.done{justify-content:center;color:var(--green)}
.row.lockedrow{opacity:.7}
.row .ico{width:56px;height:44px;flex:none;display:grid;place-items:center;font-size:26px}
.row .ico.mp{width:58px;height:56px}
.row .ico svg{width:100%;height:100%}
.row .rb{flex:1;min-width:0}
.row .rb b{display:block;font-size:14px}
.row .rb small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.7}
.grp{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-size:13px}
.grp:first-of-type{margin-top:2px}
.grp b{color:var(--c)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#22e6ff,#8b5cf6);color:#07051a;cursor:pointer;white-space:nowrap;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:8px 12px}
.btn.wide{width:100%;margin-top:4px;padding:13px;font-size:14px;background:linear-gradient(135deg,#ffd166,#ff4fa3)}
.btn.sell{background:linear-gradient(135deg,#ff4fa3,#ff8a3d)}
.btn:disabled{background:#2b2550;color:#7a70a8;cursor:not-allowed}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt)}
.ccard{position:relative;padding:11px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.ccard.sel{border-color:var(--c);box-shadow:0 0 18px var(--cg) inset}
.cl{display:flex;align-items:center;gap:10px}
.cl>div:nth-child(2){flex:1}
.cl b{display:block;font-size:14px}.cl small{color:var(--mut);font-size:11px}
.cp{text-align:left}
.cp b{font-size:15px}
.cp small{display:block;font-size:11px}
.up{color:var(--green)}.dn{color:var(--pink)}.fl0{color:var(--mut)}
.spark{width:100%;height:34px;margin:7px 0}
.cr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.badge{position:absolute;top:-8px;left:12px;background:var(--c);color:#06041a;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.chcard{display:flex;gap:12px;padding:12px;border:1px solid var(--neon);border-radius:18px;background:rgba(139,92,246,.1);margin-bottom:10px}
.chcard .pt{width:70px;flex:none}
.chcard b{font-size:15px}
.chcard p{margin:5px 0;font-size:13px;line-height:1.8}
.goal{font-size:12px;color:var(--cyan);margin-bottom:6px}
.bar{height:8px;border-radius:9px;background:#2b2550;overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .4s}
.ok{font-size:13px;color:var(--green);padding:5px 2px}
.tg{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(61,220,132,.14);color:var(--green)}
.lb{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px}
.lb.me{border:1px solid var(--cyan);background:rgba(34,230,255,.08)}
.lb em{font-style:normal;font-size:10.5px;color:var(--mut);display:block;margin-top:1px}
.lb.top3 i{font-size:15px}
.lb b{font-size:12.5px}
.me-card{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;margin-bottom:10px;border-radius:16px;border:1px solid var(--cyan);background:linear-gradient(135deg,rgba(34,230,255,.12),rgba(139,92,246,.1));font-size:13px}
.me-card b{font-size:15px}
.btn.claim{background:linear-gradient(135deg,#7dffb0,#22e6ff);animation:pls 1.4s ease-in-out infinite}
.lb i{font-style:normal;width:22px;text-align:center;color:var(--gold);font-weight:800}
.lb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Language preference — small, unobtrusive profile control */
.lang-switch{display:flex;align-items:center;gap:10px;width:100%;margin:2px 0 14px;padding:11px 12px;border:1px solid rgba(111,211,242,.22);border-radius:14px;background:linear-gradient(110deg,rgba(58,168,240,.10),rgba(143,123,216,.09));text-align:start;cursor:pointer;transition:border-color .18s,transform .18s,background .18s}
.lang-switch:active{transform:scale(.985)}
.lang-switch .lang-globe{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:11px;background:rgba(58,168,240,.13);color:var(--cyan)}
.lang-switch .lang-globe svg{width:19px;height:19px}
.lang-switch .lang-copy{min-width:0;flex:1}
.lang-switch .lang-copy b{display:block;font-size:12.5px;font-weight:800}
.lang-switch .lang-copy small{display:block;margin-top:2px;color:var(--mut);font-size:10.5px}
.lang-switch .lang-value{display:flex;align-items:center;gap:5px;flex:none;padding:5px 8px;border-radius:9px;border:1px solid var(--line2);font-size:10.5px;font-weight:800;color:var(--txt);white-space:nowrap}
.lang-switch .lang-value .ic{width:13px;height:13px;color:var(--cyan)}
html[lang="en"] body,html[lang="en"] #app{direction:ltr}
html[lang="en"] .cp,html[lang="en"] .as .v,html[lang="en"] .mrow .v{text-align:right}
html[lang="en"] .in{direction:ltr;text-align:left}
html[lang="en"] #bubble .bt{border-radius:16px 16px 16px 4px}

/* Wallet / Profile */
.in{width:100%;padding:12px 13px;margin:6px 0;border-radius:13px;border:1px solid var(--line);background:rgba(8,5,24,.6);color:var(--txt);font:inherit;font-size:15px;direction:ltr;text-align:left;user-select:text;-webkit-user-select:text;outline:0}
.in:focus{border-color:var(--cyan)}
.in.fa{direction:rtl;text-align:right}
textarea.in{min-height:120px;resize:none;line-height:1.9;display:block}
.pf{display:flex;gap:11px;align-items:center;padding:2px 2px 12px}
.av{width:46px;height:46px;border-radius:50%;flex:none;padding:2px;background:conic-gradient(#22e6ff,#8b5cf6,#ff4fa3,#22e6ff);overflow:hidden}
.av img,.av span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#9be37f,#3ddc84);color:#06210f;font-weight:900;font-size:15px}
.pi{min-width:0;flex:1}.pi>b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pi small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.bd{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.bd span{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07)}
.admgo{flex:none;border:1px solid rgba(255,194,71,.55);background:rgba(255,194,71,.12);color:var(--gold);border-radius:12px;padding:8px 11px;font-size:11.5px;font-weight:800}

/* hero */
.hero{position:relative;overflow:hidden;padding:16px 15px 13px;border-radius:24px;border:1px solid rgba(255,194,71,.38);background:radial-gradient(120% 150% at 100% 0%,rgba(255,194,71,.24),transparent 58%),radial-gradient(90% 120% at 0% 100%,rgba(34,230,255,.14),transparent 60%),linear-gradient(135deg,#2c1a70,#150d3a 72%);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero>small{display:flex;align-items:center;gap:6px;color:#d6cdff;font-size:12px}
.hero>small:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.hero .big{display:block;font-size:31px;font-weight:900;color:var(--gold);text-shadow:0 0 22px rgba(255,194,71,.45);margin:3px 0 12px;letter-spacing:.2px;line-height:1.3}
.hp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hp>div{padding:8px 4px;border-radius:14px;background:rgba(8,5,24,.5);border:1px solid rgba(255,255,255,.08);text-align:center;min-width:0}
.hp small{display:block;font-size:10px;color:var(--mut);margin-bottom:1px}
.hp b{font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* actions */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0 2px}
.acts button{border:0;background:none;display:grid;gap:6px;justify-items:center;font-size:11.5px;font-weight:700;color:var(--txt);padding:0;cursor:pointer}
.acts i{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(232,145,58,.22),rgba(58,168,240,.1));border:1px solid var(--line);transition:transform .12s}
.acts button:active i{transform:scale(.92)}
.acts .ic{width:23px;height:23px}
.acts button.hl i{background:linear-gradient(135deg,#ffd166,#ff9f43);border:0;box-shadow:0 6px 18px rgba(255,170,60,.35)}
.acts .hl .ic{color:#241304}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:17px 2px 8px;gap:8px}.sh b{font-size:14px}.sh small{color:var(--mut);font-size:11px}

/* asset rows */
.as{display:flex;align-items:center;gap:11px;padding:10px 11px;margin-bottom:7px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.as .n{flex:1;min-width:0}.as .n b{display:block;font-size:13.5px}.as .n small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.as .v{text-align:left;min-width:0}.as .v b{display:block;font-size:13px}.as .v small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.as .btn.sm{padding:8px 12px;font-size:12px;flex:none}

/* Wallet v2 (فاز ۳) — کارت ماین‌شده، CTA چسبان، اسکلت، خطا، تایم‌لاین */
.mcard{border:1px solid rgba(255,194,71,.32);background:linear-gradient(135deg,rgba(255,194,71,.09),rgba(244,239,230,.02));border-radius:var(--r-lg);padding:12px;margin:14px 0 2px}
.mcard .mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.mcard .mh small{display:block;font-size:10.5px;color:var(--mut)}
.mcard .mtotal{font-size:17px;font-weight:900;color:var(--c-star)}
.mhint{font-size:10px;color:var(--mut)}
.mrow{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.mrow:last-of-type{border-bottom:0}
.mrow:active{background:rgba(244,239,230,.05)}
.mrow .n{flex:1;min-width:0}.mrow .n b{font-size:13.5px;display:block}.mrow .n small{display:block;color:var(--mut);font-size:10.5px;margin-top:1px}
.mrow .v{text-align:left}.mrow .v b{font-size:13px;display:block}.mrow .v small{display:block;color:var(--mut);font-size:10.5px}
.mch{color:var(--mut2)}
.pchg{display:inline-flex;align-items:center;gap:2px;font-weight:800}
.pchg .ic{width:12px;height:12px}
.pchg.up{color:var(--up)}.pchg.dn{color:var(--down)}
.scta{position:sticky;bottom:-16px;z-index:2;margin-top:12px;padding:12px 0 16px;background:linear-gradient(180deg,rgba(19,16,34,0),var(--bg1) 30%)}
.verr{display:block;color:var(--down);font-size:11.5px;min-height:15px;margin:-2px 0 4px}
.skel{position:relative;overflow:hidden;background:rgba(244,239,230,.06);border-radius:12px;height:52px;margin-bottom:8px}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,rgba(244,239,230,.07) 50%,transparent 80%);animation:skelA 1.4s infinite}
@keyframes skelA{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.werr{display:grid;gap:10px;justify-items:center;padding:22px 10px;border:1px solid rgba(255,92,122,.4);border-radius:var(--r-lg);background:rgba(255,92,122,.07);margin:12px 0;text-align:center}
.werr .ic{color:var(--down)}
.werr b{font-size:14px}
.werr small{color:var(--mut);font-size:12px}
.wempty{display:grid;gap:8px;justify-items:center;padding:20px 10px;color:var(--mut);text-align:center;font-size:12px}
.wempty .ic{width:30px;height:30px;color:var(--mut2)}
.wempty b{color:var(--txt);font-size:13px}
.tl{display:flex;align-items:center;margin-top:6px;font-size:9.5px;color:var(--mut)}
.tl span{display:inline-flex;align-items:center;gap:4px}
.tl span:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(244,239,230,.12);border:1px solid var(--line2);flex:none}
.tl span:not(:last-child):after{content:"";width:14px;height:1.5px;background:var(--line2);flex:none}
.tl span.on:before{background:var(--up);border-color:var(--up)}
.tl span.now:before{background:var(--warn);border-color:var(--warn);animation:pls 1.4s ease-in-out infinite}
.tl span.bad:before{background:var(--down);border-color:var(--down)}
.ti .ic{width:17px;height:17px}
.cp2 button{display:inline-flex;align-items:center;gap:5px}
.cp2 button .ic{width:13px;height:13px}
.chs button{display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chs .ci{flex:none}

/* tx */
.tx{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.tx:last-child{border:0}
.ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;background:rgba(255,255,255,.07)}
.ti.p{background:rgba(61,220,132,.16)}.ti.m{background:rgba(255,79,163,.16)}.ti.g{background:rgba(255,194,71,.16)}
.tx .n{flex:1;min-width:0}.tx .n b{display:block;font-size:12.5px}.tx .n small{display:block;font-size:10.5px;color:var(--mut)}
.tx>b{font-size:12.5px}.tx>b.p{color:var(--green)}.tx>b.m{color:var(--pink)}

/* flow */
.fh{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.fh button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);display:grid;place-items:center;padding:0}
.fh svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fh b{font-size:15.5px}
.gmc{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;margin-bottom:10px;border-radius:18px;border:1px solid rgba(255,194,71,.4);background:linear-gradient(135deg,rgba(255,194,71,.16),rgba(139,92,246,.1))}
.gmc small{color:#ddd3ff;font-size:12px}.gmc b{font-size:18px;color:var(--gold)}
.chs{display:flex;gap:6px;margin:6px 0}
.chs button{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700;font-size:12.5px;line-height:1.5}
.chs button small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.chs button.on{border-color:var(--c,var(--cyan));background:rgba(255,255,255,.1)}
.inr{position:relative}.inr .in{padding-left:64px}
.mx{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;border-radius:9px;padding:6px 11px;background:rgba(139,92,246,.3);font-size:12px;font-weight:700}
.cp2{display:flex;align-items:center;gap:8px;padding:9px 11px;margin:6px 0;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);flex-wrap:wrap}
.cp2 small{flex:1 0 100%;color:var(--mut);font-size:11px}
.cp2 code{flex:1;min-width:0;direction:ltr;text-align:left;font-size:11.5px;word-break:break-all;user-select:text;-webkit-user-select:text}
.cp2 button{border:0;border-radius:9px;padding:6px 11px;background:rgba(139,92,246,.3);font-size:12px;font-weight:700}
.btn.ton{background:linear-gradient(135deg,#38b6ff,#1f7be0);color:#fff}
.btn.w2{width:100%;margin-top:8px;padding:11px}
.flip{text-align:center}.flip button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:50%;width:34px;height:34px;font-size:16px}
.qt{padding:10px 4px;text-align:center;font-size:13px;color:var(--cyan)}

/* admin */
.admb{width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,194,71,.55);background:rgba(255,194,71,.13);color:var(--gold);padding:0;display:grid;place-items:center;cursor:pointer}
.admb.hide{display:none}
.admb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none}.atabs::-webkit-scrollbar{display:none}
.atabs button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--mut)}
.atabs button.on{background:linear-gradient(135deg,#ffd166,#ff8a3d);color:#1a1004;border:0}
.atabs button i{font-style:normal;background:#ff4f6a;color:#fff;border-radius:99px;padding:0 6px;margin-inline-start:5px;font-size:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{padding:11px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);min-width:0}
.kpi small{display:block;font-size:11px;color:var(--mut)}
.kpi b{display:block;font-size:19px;font-weight:900;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi em{font-style:normal;font-size:10.5px;color:var(--mut);display:block}
.kpi.wide{grid-column:1/-1}
.kpi.warn{border-color:rgba(255,194,71,.6);background:rgba(255,194,71,.09)}.kpi.warn b{color:var(--gold)}
.kpi.good b{color:var(--green)}
.alert{padding:10px 12px;margin-bottom:10px;border-radius:14px;border:1px solid rgba(255,79,106,.6);background:rgba(255,79,106,.1);font-size:12px;line-height:1.9}
.bars{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--cyan),#8b5cf6);min-height:3px}
.bars b{font-size:10px}.bars small{font-size:9.5px;color:var(--mut)}
.aitem{padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}
.aitem.tap{cursor:pointer}.aitem.tap:active{background:rgba(255,255,255,.07)}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ah b{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.7}
.am{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}.am b{font-size:16px}.am em{font-style:normal;font-size:11.5px;color:var(--mut)}
.pill{font-size:10.5px;padding:3px 9px;border-radius:99px;font-weight:700;flex:none}
.pill.pending{background:rgba(255,194,71,.16);color:var(--gold)}
.pill.paid,.pill.done{background:rgba(61,220,132,.16);color:var(--green)}
.pill.rejected,.pill.ban{background:rgba(255,79,163,.16);color:var(--pink)}
.btnrow{display:flex;gap:8px;margin-top:9px}.btnrow .btn{flex:1;padding:11px 6px}
.btn.ok2{background:linear-gradient(135deg,#7dffb0,#22e6ff)}
.btn.no2{background:linear-gradient(135deg,#ff6a88,#ff4fa3);color:#fff}
.sw{width:46px;height:26px;border-radius:99px;border:0;background:#2b2550;position:relative;padding:0;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#9a90c8;transition:right .2s,background .2s}
.sw.on{background:linear-gradient(135deg,#7dffb0,#22e6ff)}.sw.on i{right:23px;background:#fff}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px}
.fld>span{font-size:13px;line-height:1.5}.fld>span small{display:block;font-size:10.5px;color:var(--mut)}
.fld .in{width:104px;margin:0;padding:9px 8px;text-align:center;flex:none}
.srch{display:flex;gap:8px;margin-bottom:10px}.srch .in{margin:0;direction:rtl;text-align:right}.srch .btn{flex:none;padding:0 16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.fg>div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);min-width:0}
.fg small{display:block;font-size:10.5px;color:var(--mut)}.fg b{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Nav (فاز ۲) — آیکون سفارشی + حالت فعال برجسته + بج اعلان + safe-area */
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 6px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(11,10,20,.94);border-top:1px solid var(--line);position:relative;z-index:var(--z-nav)}
nav button{position:relative;background:none;border:0;min-height:50px;padding:6px 2px 4px;border-radius:var(--r-md);font-size:10.5px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:color var(--t-fast),background var(--t-fast)}
nav button .ic{width:23px;height:23px}
nav button.on{color:var(--txt);background:rgba(232,145,58,.13)}
nav button.on .ic{color:var(--brand2)}
.nbadge{position:absolute;top:5px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 6px var(--brand)}
.nbadge.hide{display:none}

/* Icon System (فاز ۱) — آیکون‌های اسپرایت؛ رنگ از currentColor */
.ic{width:22px;height:22px;flex:none;display:block}
.ic.s{width:16px;height:16px}
.ic.l{width:28px;height:28px}
#sheetHead button .ic{width:17px;height:17px;margin:0 auto}

/* Style Guide (فاز ۱) — صفحه‌ی مرجع داخلی */
.sg-pal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sg-sw{display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.sg-sw i{height:30px;border-radius:8px;border:1px solid rgba(244,239,230,.14)}
.sg-sw b{font-size:11px}
.sg-sw small{font-size:9px;color:var(--mut);direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace}
.sg-lg{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:16px 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.sg-mini{display:grid;gap:6px;place-items:center}
.sg-ic{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sg-ic>div{display:grid;gap:5px;place-items:center;padding:10px 2px 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.sg-ic small{font-size:8.5px;color:var(--mut)}
.sg-type .t1{font-size:23px;font-weight:900;display:block;line-height:1.5}
.sg-type .t2{font-size:16px;font-weight:800;display:block;margin-top:8px;line-height:1.6}
.sg-type small{display:block;color:var(--mut);font-size:10.5px}
.sg-type p{font-size:13px;line-height:1.9;margin:8px 0 0}
.sg-row{display:flex;gap:10px;align-items:center;margin:10px 0 4px}

/* Popover ماینر (فاز ۴): کارت جزئیات بالای خود دستگاه */
#pop{position:absolute;z-index:5;width:212px;animation:popin .22s var(--e-spring);filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
#pop.hide{display:none}
#pop .pop-h{width:12px;height:12px;background:var(--glass);border:1px solid var(--line2);border-top:0;border-inline-start:0;transform:rotate(45deg);margin:0 auto -7px;position:relative;z-index:1}
#pop .pop-b{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:var(--r-md);padding:11px 12px}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.94)}}
#pop .pt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#pop .pt b{font-size:13.5px;flex:1}
#pop .st{font-size:10.5px;color:var(--mut);display:grid;gap:2px;margin-bottom:9px}
#pop .st b{color:var(--txt);font-weight:800}
#pop .btnrow{display:flex;gap:6px}
#pop .btnrow .btn{flex:1;padding:8px 6px;font-size:11.5px}

#sndBtn{position:absolute;top:62px;left:10px;z-index:var(--z-nav);width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--mut)}
#sndBtn .ic{width:17px;height:17px}
#sndBtn:active{transform:scale(.92)}
#sndBtn.off{color:var(--mut2)}
#sheet{will-change:transform}
#sheetBody.animin>*{animation:fadeup .24s var(--e-out) both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
@media (max-width:359px){#hud b{font-size:17px}#hud .chip b{font-size:10.5px}nav button{font-size:9.5px}nav button .ic{width:21px;height:21px}.mcard .mtotal{font-size:15px}}

/* قطعی برق (فاز ۷+): ماینرها و مانیتورها تاریک می‌شن */
#room.blk #rackItems [data-act="slot"],#room.blk [data-act="mine"]{filter:brightness(.28) saturate(.25)}
#room.blk #rackItems [data-act="shelf"]{filter:brightness(.7)}
#room #rackItems [data-act="slot"],#room [data-act="mine"]{transition:filter .4s}

/* گفتگوی داستان (فاز ۶) */
#dlg{position:absolute;left:10px;right:10px;bottom:14px;z-index:6;display:flex;gap:10px;align-items:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:var(--r-lg);padding:10px 12px;cursor:pointer;animation:popin .25s var(--e-spring);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#dlg.hide{display:none}
#dlg .dp{width:52px;height:62px;flex:none;display:grid;place-items:center}
#dlg .db{flex:1;min-width:0}
#dlg .dn{font-size:10.5px;font-weight:800;color:var(--cc,var(--c-star));margin-bottom:3px}
#dlg .dt{font-size:13.5px;line-height:1.9}
#dlg .dnext{flex:none;color:var(--mut);font-size:10px;white-space:nowrap}

/* کارت رویداد شناور (فاز ۶) */
#evbtn{position:absolute;z-index:4;border:0;border-radius:var(--r-md);display:flex;flex-direction:column;gap:3px;align-items:center;padding:9px 13px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);color:var(--txt);font-weight:800;font-size:11px;cursor:pointer;animation:popin .3s var(--e-spring);box-shadow:0 8px 22px rgba(0,0,0,.45)}
#evbtn .ic{width:20px;height:20px;color:var(--brand2)}
#evbtn small{font-size:8.5px;color:var(--mut);font-weight:600}
#evbtn.hide{display:none}

/* Shop cards (فاز ۵) — فروشگاه ماینر با آمار و بازگشت سرمایه */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn .ic{width:14px;height:14px}
.shop{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:11px;margin-bottom:10px}
.shop .top{display:flex;gap:11px;align-items:center}
.shop .pv{width:64px;height:60px;flex:none;display:grid;place-items:center;background:radial-gradient(85% 95% at 50% 30%,rgba(244,239,230,.09),transparent 70%),rgba(11,10,20,.5);border:1px solid var(--line);border-radius:12px}
.shop .pv svg{width:50px;height:48px}

<!-- ═══ Icon System + لوگوی ارزها (فاز ۱) — اسپرایت SVG · گرید ۲۴ · خط ۱٫۸ ═══ -->
<svg id="sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">

const FA_EN_KEYS=Object.keys(FA_EN).sort((a,b)=>b.length-a.length);
const textOrigins=new WeakMap(),textLast=new WeakMap(),attrOrigins=new WeakMap(),attrLast=new WeakMap();
function isCodeNode(n){const p=n&&n.parentElement;return !!(p&&p.closest('script,style,textarea,code'));}
function faToEnglish(value){
 if(!value||!/[\u0600-\u06FF]/.test(value))return value;
 let lead=(value.match(/^\s*/)||[''])[0],trail=(value.match(/\s*$/)||[''])[0],core=value.slice(lead.length,value.length-trail.length);
 if(Object.prototype.hasOwnProperty.call(FA_EN,core))return lead+FA_EN[core]+trail;
 let out=core;for(const key of FA_EN_KEYS){if(out.includes(key))out=out.split(key).join(FA_EN[key])}
 out=out.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 return lead+out+trail;
}
function processTextNode(n){
 if(!n||n.nodeType!==Node.TEXT_NODE||isCodeNode(n))return;
 const current=n.data;let original=textOrigins.get(n);
 if(original===undefined||current!==textLast.get(n)){original=current;textOrigins.set(n,original)}
 const target=LANG==='en'?faToEnglish(original):original;
 textLast.set(n,target);if(current!==target)n.data=target;
}
function processAttr(el,name){
 if(!el||!el.hasAttribute(name))return;
 let current=el.getAttribute(name),map=attrOrigins.get(el);if(!map){map={};attrOrigins.set(el,map)}
 if(map[name]===undefined||current!==((attrLast.get(el)||{})[name]))map[name]=current;
 let last=attrLast.get(el)||{},target=LANG==='en'?faToEnglish(map[name]):map[name];last[name]=target;attrLast.set(el,last);
 if(current!==target)el.setAttribute(name,target);
}
function applyLanguage(root=document.body){
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==='fa'?'rtl':'ltr';document.title=LANG==='en'?"Miko's Miner Room":'اتاق ماینر میکو';
 if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode()))processTextNode(n);
 const attrs=['aria-label','title','placeholder','alt'];
 if(root.nodeType===Node.ELEMENT_NODE)attrs.forEach(a=>processAttr(root,a));
 root.querySelectorAll&&root.querySelectorAll('*').forEach(el=>attrs.forEach(a=>processAttr(el,a)));
}
const languageObserver=new MutationObserver(records=>{for(const r of records){if(r.type==='characterData')processTextNode(r.target);else{r.addedNodes&&r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE)processTextNode(n);else if(n.nodeType===Node.ELEMENT_NODE)applyLanguage(n)});if(r.type==='attributes'&&r.target)processAttr(r.target,r.attributeName)}}});
languageObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','placeholder','alt']});
applyLanguage(document.body);

/* ---------------- Prices ---------------- */
/* base = قیمت واقعی/مرجع · w = نوسان کوچک نمایشی (Stars و TON) · USD همیشه ثابت */
const WOB={STAR:{amp:.012,k:.10,vol:.0042},TON:{amp:.016,k:.09,vol:.0052}},HMAX=80;
const PR={};COINS.forEach(c=>{const m=WOB[c.id];let w=0;const h=[];
 for(let i=0;i<50;i++){if(m){w+=-m.k*w+(Math.random()-.5)*2*m.vol;w=Math.max(-m.amp,Math.min(m.amp,w))}h.push(c.ref*(1+w))}
 PR[c.id]={base:c.ref,w:w,usd:h[h.length-1],hist:h}});
let LIVE=false,SERVER=false;
const price=id=>PR[id].usd;
function trend(id){const h=PR[id].hist;return h.length>1?(h[h.length-1]/h[0]-1)*100:0}

async function api(path,opt){
 opt=opt||{};const ac=new AbortController(),to=setTimeout(()=>ac.abort(),6000);
 try{const r=await fetch(path,Object.assign({},opt,{signal:ac.signal,headers:Object.assign({'Content-Type':'application/json','X-Init-Data':INIT},opt.headers||{})}));
  if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(to)}}

async function pullPrices(){
 try{const r=await api('/api/prices');
  /* قیمت سرور فقط «پایه» رو عوض می‌کنه؛ نوسان ریز نمایشی روش سوار می‌شه تا نمودارها زنده بمونن */
  COINS.forEach(c=>{const d=r.coins&&r.coins[c.id];if(d&&Number.isFinite(+d.usd)&&+d.usd>0){const p=PR[c.id];p.base=+d.usd;p.usd=p.base*(1+p.w)}});
  /* قیمت Stars و USD ثابت‌اند؛ نشان «زنده» فقط وقتی TON واقعاً از سرور آمده روشن باشد. */
  LIVE=!!(r.coins&&r.coins.TON&&Number.isFinite(+r.coins.TON.usd)&&+r.coins.TON.usd>0)
 }catch(e){LIVE=false}
 /* فاز ۴: میکو از سقوط تند تون می‌ترسه */
 const tt=trend('TON');
 if(tt<-2.5&&Date.now()-lastScare>3e5){lastScare=Date.now();setMiko('scared',3200);say('وای، تون ریخت! بفروشیم یا صبر کنیم؟!',5200)}
 renderTag()}

function simulate(){ /* هر ثانیه: نوسان کوچک و برگشت‌پذیر برای Stars و TON، چه آنلاین چه آفلاین */
 COINS.forEach(c=>{const p=PR[c.id],m=WOB[c.id];
  if(c.id==='TON'&&!LIVE)p.base=Math.max(.0001,p.base*(1+(Math.random()-.5)*.004+(c.ref-p.base)/c.ref*.004));
  if(m){p.w+=-m.k*p.w+(Math.random()-.5)*2*m.vol;p.w=Math.max(-m.amp,Math.min(m.amp,p.w))}
  p.usd=p.base*(1+p.w);p.hist.push(p.usd);if(p.hist.length>HMAX)p.hist.shift()})}

function stats(){

 const bonus=(1+.05*['strip','tube','hex'].filter(k=>S.room[k]).length)*(boosting()?2:1);
 const nfac=1/(1+NETD*Math.max(0,cnt()-1));   /* سختی شبکه: هر ماینر بیشتر، بازده همه کمتر */
 const off=now<blackoutUntil;                 /* قطعی برق: تولید و قبض صفر */
 const em=(weekend()?1.1:1)*(now<rushUntil?1.5:1)*(now<compUntil?1.15:1);   /* ماین سریع / آخر هفته / جبران قطعی */
 let pw=0;const y={STAR:0,TON:0,USD:0};
 y[S.sel]+=PCY*PC[S.pc];
 S.slots.forEach(id=>{const m=id&&mById(id);if(m){y[m.coin]+=m.y*nfac;pw+=m.pw}});
 pw*=S.room.ac?.75:1;
 const rate={};let gross=0;
 COINS.forEach(c=>{rate[c.id]=off?0:y[c.id]*bonus*em*RATE/c.ref;gross+=rate[c.id]*price(c.id)});
 return {bonus,nfac,pw:off?0:pw,rate,gross,net:off?0:gross-pw}}
function worth(){let w=S.usd+(S.cashed||0);COINS.forEach(c=>w+=S.wallet[c.id]*price(c.id));S.slots.forEach(id=>{const m=id&&mById(id);if(m)w+=m.price*.6});for(let k=1;k<S.shelves;k++)w+=SHELF_COST[k]*.6;return w}

function pack(){return JSON.parse(JSON.stringify(S))}
function merge(o){
 if(!o||typeof o!=='object'||(o.v!==3&&o.v!==4))return;   /* v3 قدیمی هم پذیرفته می‌شه (فاز ۶: migration بی‌ضرر) */
 const num=v=>typeof v==='number'&&isFinite(v)&&v>=0;
 if(num(o.usd))S.usd=o.usd;
 COINS.forEach(c=>{const w=o.wallet&&o.wallet[c.id];if(num(w))S.wallet[c.id]=w});
 if(COINS.some(c=>c.id===o.sel))S.sel=o.sel;
 if(num(o.pc))S.pc=Math.min(PC.length-1,o.pc|0);
 if(num(o.shelves))S.shelves=Math.max(1,Math.min(SHELVES,o.shelves|0));
 if(num(o.taps))S.taps=o.taps|0;
 if(num(o.sold))S.sold=o.sold;
 if(num(o.cashed))S.cashed=o.cashed;
 if(num(o.ch))S.ch=Math.min(CH.length,o.ch|0);
 S.rd=(num(o.rd)&&o.rd)?1:0;
 if(num(o.en)&&num(o.et)){S.en=Math.min(EMAX,o.en);S.et=Math.min(o.et,Date.now())}
 if(typeof o.dl==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.dl))S.dl=o.dl;
 if(num(o.st))S.st=Math.min(7,o.st|0);
 if(num(o.cs))S.cs=Math.min(CH.length,o.cs|0);   /* صحنه‌های دیده‌شده‌ی داستان (v4) */
 if(num(o.cos))S.cos=Math.min(15,o.cos|0);       /* لباس‌های میکو (فاز ۷+) */
 if(num(o.co))S.co=Math.min(3,o.co|0);
 if(num(o.mb))S.mb=o.mb|0;
 if(typeof o.wk==='string'&&/^\d{4}-W\d{1,2}$/.test(o.wk))S.wk=o.wk;
 if(o.wp&&typeof o.wp==='object')['t0','s0','b0'].forEach(k=>{const v=o.wp[k];if(typeof v==='number'&&isFinite(v)&&v>=0)S.wp[k]=v});
 if(num(o.wc))S.wc=Math.min(7,o.wc|0);

/* ---------------- Isometric engine ---------------- */
const s=22,kx=s*.866,ky=s*.5,X0=225,Y0=180,L=9,H=7.5;
const P=(a,b,z)=>[X0+(a-b)*kx,Y0+(a+b)*ky-z*s];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const poly=(arr,fill,ex='')=>`<polygon points="${pts(arr)}" fill="${fill}" ${ex}/>`;
function box(a,b,z,w,d,h,c,ex=''){
 return `<g ${ex}>`+poly([P(a,b,z+h),P(a+w,b,z+h),P(a+w,b+d,z+h),P(a,b+d,z+h)],c[0])
 +poly([P(a,b+d,z),P(a+w,b+d,z),P(a+w,b+d,z+h),P(a,b+d,z+h)],c[1])
 +poly([P(a+w,b,z),P(a+w,b+d,z),P(a+w,b+d,z+h),P(a+w,b,z+h)],c[2])+`</g>`}
const MX=(a,b,c,d,e,f)=>`matrix(${a} ${b} ${c} ${d} ${e} ${f})`;
const onB=(B,inner,ex='')=>`<g transform="${MX(kx,ky,0,-s,X0-B*kx,Y0+B*ky)}" ${ex}>${inner}</g>`;   /* plane b=B : u=a, v=z */
const onA=(A,inner,ex='')=>`<g transform="${MX(-kx,ky,0,-s,X0+A*kx,Y0+A*ky)}" ${ex}>${inner}</g>`;  /* plane a=A : u=b, v=z */
const onTop=(Z,inner,ex='')=>`<g transform="${MX(kx,ky,-kx,ky,X0,Y0-Z*s)}" ${ex}>${inner}</g>`;    /* plane z=Z : u=a, v=b */
const glow=inner=>`<g filter="url(#glow)">${inner}</g>`;
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

function fan(cx,cy,r,col,dur){
 let bl='';for(let k=0;k<4;k++)bl+=`<ellipse cx="${cx}" cy="${cy+r*.52}" rx="${r*.2}" ry="${r*.46}" fill="${col}" opacity=".9" transform="rotate(${k*90} ${cx} ${cy})"/>`;
 return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#080618" stroke="${col}" stroke-width=".04"/><g><animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="${dur}" repeatCount="indefinite"/>${bl}</g><circle cx="${cx}" cy="${cy}" r="${r*.2}" fill="#fff" opacity=".85"/>`}

/* ---------------- Formatting HUD (فاز ۲): فشرده، خوانا، بدون ۸ رقم اعشار ---------------- */
/* دقت تطبیقی: هرچه عدد کوچک‌تر، رقم اعشار بیشتر (حداکثر ۶) · بزرگ‌ها K/M/B */
const kfmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':null;
function fmtNum(n){if(!Number.isFinite(+n))return '0';const a=Math.abs(+n);const d=a===0?2:a>=1000?2:a>=1?4:a>=.01?6:8;return (+n).toLocaleString('en-US',{minimumFractionDigits:a>0&&a<1?Math.min(6,d):0,maximumFractionDigits:d,useGrouping:a>=1000})}
function fmtUsd(n){const s=n<0?'−':'',a=Math.abs(n),k=kfmt(a);
 if(k&&a>=1000)return s+'$'+k;if(a===0)return '$0.00';
 return s+'$'+fmtNum(a)}
const fmtChip=(id,n)=>fmtNum(n);   /* عدد کامل؛ فقط اگه جا کم بود فونت کوچیک می‌شه (fitHUD) */
/* شمارنده‌ی انیمیشنی بالانس (فقط روی تغییر گسسته، نه تیک ثانیه‌ای) */
let lastBal=null,balTgt=null,balTW=0;
function setBal(v){
 const el=$('#bal');
 if(v===balTgt&&balTW)return;
 if(lastBal===null||REDUCE||Math.abs(v-lastBal)<1e-9){lastBal=v;balTgt=v;el.textContent=fmtUsd(v);return}
 const from=lastBal;balTgt=v;cancelAnimationFrame(balTW);const t0=performance.now();
 const step=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);
  el.textContent=fmtUsd(from+(v-from)*e);
  if(k<1)balTW=requestAnimationFrame(step);else{balTW=0;lastBal=v}};
 balTW=requestAnimationFrame(step)}
/* نمایش عدد دقیق با نگه‌داشتن روی بالانس */
let balHoldT=null,balExactT=null;

 if(on){$('#bal').textContent=f$(S.usd);balExactT=setTimeout(()=>balExact(false),2400)}
 else{clearTimeout(balExactT);if(!(balTgt===S.usd&&balTW))$('#bal').textContent=fmtUsd(S.usd)}}

 COINS.forEach(c=>{$('#cw-'+c.id).textContent=fmtChip(c.id,S.wallet[c.id]);$('#chip-'+c.id).classList.toggle('sel',S.sel===c.id);

 $('#boostTag').classList.toggle('hide',!boosting());$('#taskDot').classList.toggle('hide',!claimable());
 /* بج‌های ناوبری: اقدام قابل‌انجام */

 const nx=S.pc+1;
 $('#nb-up').classList.toggle('hide',!((nx<PC.length&&S.usd>=PCCOST[nx])||ROOM.some(r=>!S.room[r.id]&&S.usd>=r.price)));
 const en=energy();$('#enbar').style.width=(en/EMAX*100)+'%';$('#entxt').textContent=Math.floor(en);

function fitTxt(el,min,imp){
 if(!el)return;const key=el.textContent+'|'+el.clientWidth;if(el.dataset.fk===key)return;el.dataset.fk=key;
 el.style.removeProperty('font-size');let fs=parseFloat(getComputedStyle(el).fontSize)||14,n=0;
 while(el.scrollWidth>el.clientWidth+1&&fs>min&&n<16){fs-=.5;el.style.setProperty('font-size',fs+'px',imp?'important':'');n++}}

 floatAt(e,fs(S.sel,amt),c.col);burst(e.clientX,e.clientY,c.col,7,3);hap('light');sfx('tap');setMood('happy',900);flashChip(S.sel);

const dailyReady=()=>S.dl!==dayKey();

/* ماموریت هفتگی (فاز ۷+): سه مأموریت، ریست هر هفته، جایزه‌ی کوچک زیر سقف bucket */
const wkKey=()=>{const d=new Date(),o=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil((((d-o)/864e5)+o.getDay()+1)/7)};
const WEEKM=[
 {t:'سیصد ضربه',d:'این هفته ۳۰۰ بار بزن',k:'t0',cur:()=>S.taps,goal:300,goalTxt:v=>Math.round(v),rw:.05},

 {t:'نصب‌چی',d:'این هفته ۵ ماینر نصب کن',k:'b0',cur:()=>S.mb||0,goal:5,goalTxt:v=>Math.round(v),rw:.20}];
function weeklyCheck(){const k=wkKey();if(S.wk===k)return;S.wk=k;WEEKM.forEach(m=>S.wp[m.k]=m.cur());S.wc=0;save(true)}
const weekDone=i=>{const m=WEEKM[i];return (m.cur()-(S.wp[m.k]||0))>=m.goal};

/* ---------------- Particles (canvas) ---------------- */
const cv=$('#fx');let g2=null;try{g2=cv&&cv.getContext('2d')}catch(e){}let PW=0,PH=0,DPR=1;
const parts=[];
function resizeFx(){const r=$('#scene').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);PW=r.width;PH=r.height;cv.width=PW*DPR;cv.height=PH*DPR;cv.style.width=PW+'px';cv.style.height=PH+'px'}
function burst(cx,cy,col,n,sp){
 const r=$('#scene').getBoundingClientRect();const x=cx-r.left,y=cy-r.top;
 if(parts.length>90)return;
 for(let i=0;i<(REDUCE?2:n);i++)parts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:-Math.random()*sp-1,g:.14,l:1,d:.018+Math.random()*.02,r:1.6+Math.random()*2.6,c:col})}
function celebrate(){const r=$('#scene').getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>burst(r.left+r.width*(.2+Math.random()*.6),r.top+r.height*.5,['#ffc247','#2aa9ff','#3ddc84','#ff4fa3'][i%4],10,4),i*90)}
let lastF=0,fxRaf=0;
function fxLoop(ts){
 fxRaf=0;
 if(!g2||document.hidden||(sheet.tab&&sheet.f>=.999)||ts-lastF<30){if(!document.hidden&&!(sheet.tab&&sheet.f>=.999))fxRaf=requestAnimationFrame(fxLoop);return}lastF=ts;
 try{
 g2.setTransform(DPR,0,0,DPR,0,0);g2.clearRect(0,0,PW,PH);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=p.d;if(p.l<=0){parts.splice(i,1);continue}
  g2.globalAlpha=Math.max(0,p.l);g2.save();g2.translate(p.x,p.y);p.rot=(p.rot||0)+(p.vr||0);g2.rotate(p.rot||0);g2.fillStyle=p.c;g2.strokeStyle='rgba(255,255,255,.78)';g2.lineWidth=1;
  if(p.type==='star'){g2.beginPath();for(let q=0;q<10;q++){const a=-Math.PI/2+q*Math.PI/5,r=p.r*(q%2?.48:1);q?g2.lineTo(Math.cos(a)*r,Math.sin(a)*r):g2.moveTo(Math.cos(a)*r,Math.sin(a)*r)}g2.closePath();g2.fill();g2.stroke()}
  else if(p.type==='gem'){g2.beginPath();g2.moveTo(0,-p.r);g2.lineTo(p.r*.75,-p.r*.25);g2.lineTo(p.r*.55,p.r*.7);g2.lineTo(-p.r*.55,p.r*.7);g2.lineTo(-p.r*.75,-p.r*.25);g2.closePath();g2.fill();g2.stroke()}
  else{g2.beginPath();g2.arc(0,0,p.r*.82,0,6.283);g2.fill();g2.stroke();g2.fillStyle='#fff';g2.font='bold 7px sans-serif';g2.textAlign='center';g2.textBaseline='middle';g2.fillText('$',0,.5)}
  g2.restore();}   /* ذرات سکه‌ی بی‌جاذبه حاشیه‌ی روشن دارن */
 g2.globalAlpha=1}catch(err){console.warn('fx frame',err)}finally{if(!document.hidden&&!(sheet.tab&&sheet.f>=.999))fxRaf=requestAnimationFrame(fxLoop)}}

/* ---------------- Sheets ---------------- */
const SNAP=[.4,.75,1];
const sheet={tab:null,slot:0,f:1,t:0};
const sheetH=()=>($('#sheet').offsetHeight||1);
const tOf=f=>sheetH()*(1-f);
function applyT(t){sheet.t=t;$('#sheet').style.transform='translateY('+t.toFixed(1)+'px)'}
function syncMotion(){
 const covered=!!sheet.tab&&sheet.f>=.999;
 const paused=covered||document.hidden||document.documentElement.classList.contains('tg-inactive');
 try{if(paused)$('#room').pauseAnimations();else $('#room').unpauseAnimations()}catch(e){}
 if(paused){if(fxRaf){cancelAnimationFrame(fxRaf);fxRaf=0}}
 else if(!fxRaf&&typeof fxLoop==='function')fxRaf=requestAnimationFrame(fxLoop);
}
function setSnap(f){sheet.f=f;applyT(tOf(f));syncMotion()}
let closeTO=null;
function openSheet(tab,i){
 if(sheet.tab===tab&&tab!=='slot'&&i===undefined){closeSheet();return}
 if(tab==='wallet'&&sheet.tab!=='wallet'){W.v='home';W.amt=''}
 sheet.tab=tab;if(i!==undefined)sheet.slot=i;
 sheet.f=(tab==='slot')?.75:1;
 clearTimeout(closeTO);
 const el=$('#sheet');el.classList.add('open');el.setAttribute('aria-hidden','false');
 $('#app').classList.add('sopen');$('#bubble').classList.add('hide');hidePop();
 renderSheet();
 const sb2=$('#sheetBody');sb2.classList.remove('animin');void sb2.offsetWidth;sb2.classList.add('animin');
 requestAnimationFrame(()=>{if(sheet.tab)applyT(tOf(sheet.f));syncMotion()});
 document.documentElement.style.setProperty('--vvh',(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px');
 if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.expand)try{Telegram.WebApp.expand()}catch(e){}
 document.querySelectorAll('nav button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
 syncMotion()
}
function closeSheet(){
 if(!sheet.tab)return;
 sheet.tab=null;sheet.f=0;
 $('#app').classList.remove('sopen');
 applyT(sheetH()+40);syncMotion();
 document.querySelectorAll('nav button').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-current','false')});
 clearTimeout(closeTO);closeTO=setTimeout(()=>{if(!sheet.tab){const el=$('#sheet');el.classList.remove('open');el.setAttribute('aria-hidden','true');syncMotion()}},360)
}
/* درگ هندل: انتخاب نزدیک‌ترین snap، پرتاب با سرعت، بستن با کشیدن یا ضربه به scrim */
(function(){
 const head=$('#sheetHead .grab');let d=null;
 head.addEventListener('pointerdown',e=>{
  if(sheet.tab===null)return;
  d={y0:e.clientY,t0:sheet.t,y:e.clientY,ts:performance.now(),v:0,moved:false};
  $('#sheet').classList.add('drag');
  try{head.setPointerCapture(e.pointerId)}catch(_){}});
 head.addEventListener('pointermove',e=>{
  if(!d)return;
  const now=performance.now(),dy=e.clientY-d.y0;
  d.v=(e.clientY-d.y)/Math.max(1,now-d.ts);d.y=e.clientY;d.ts=now;
  if(Math.abs(dy)>4)d.moved=true;
  applyT(Math.min(d.t0+(dy>0?dy:dy*.18),sheetH()+60))});
 const end=()=>{
  if(!d)return;const g=d;d=null;$('#sheet').classList.remove('drag');
  if(!g.moved)return;
  const h=sheetH(),cand=[tOf(1),tOf(.75),tOf(.4),h+40];
  let best=cand[0],bd=1e9;
  cand.forEach(c=>{const dd=Math.abs(sheet.t-c);if(dd<bd){bd=dd;best=c}});
  const below=cand.filter(c=>c>g.t0+8),above=cand.filter(c=>c<g.t0-8);
  if(g.v>.55&&below.length)best=below[0];
  else if(g.v<-.55&&above.length)best=above[above.length-1];
  if(best>=h+20){closeSheet();return}
  const f=1-best/h;
  setSnap(SNAP.reduce((a,b)=>Math.abs(b-f)<Math.abs(a-f)?b:a))};
 head.addEventListener('pointerup',end);
 head.addEventListener('pointercancel',end);
})();
$('#scrim').addEventListener('click',()=>closeSheet());

const frate=(id,n)=>id==='USD'?'$'+fmtNum(n)+'/s':fmtNum(n)+(id==='STAR'?' Stars':' TON')+'/s';
function spark(h){
 const mn=Math.min(...h),mx=Math.max(...h),rg=(mx-mn),n=h.length-1||1;
 const pts=h.map((v,i)=>`${(i*100/n).toFixed(1)},${(rg<1e-9?15:28-(v-mn)/rg*26).toFixed(1)}`).join(' ');
 return {line:pts,area:`0,30 ${pts} 100,30`}}

/* فروشگاه ماینر (فاز ۵): کارت با آمار، بازگشت سرمایه و مقایسه با ماینر فعلی */
function shopCard(m,full){
 const c=coin(m.coin);
 const same=MINERS.filter(x=>x.coin===m.coin&&S.slots.includes(x.id));
 const best=same.length?same.reduce((a,b)=>b.y>a.y?b:a):null;
 const net=Math.max(1e-9,m.y-m.pw),pb=m.price/net;
 const pbTxt=pb>=86400?(pb/86400).toFixed(1)+' روز':pb>=3600?(pb/3600).toFixed(1)+' ساعت':Math.round(pb/60)+' دقیقه';
 const cmp=`<span class="tier" aria-label="سطح ${m.tier} از 3">${[1,2,3].map(k=>`<i class="${k<=m.tier?'on':''}"></i>`).join('')}</span>`;
 const afford=S.usd>=m.price,can=!full&&afford;
 return `<div class="shop">

/* انتقال یک ارز ماین‌شده به کیف پول — نتیجه را برمی‌گرداند تا «انتقال همه» هم استفاده کند */
async function wCash(cid,quiet){
 if(!INIT){if(!quiet)toast('فقط داخل تلگرام');return{error:'tg'}}
 if(W.busy)return{error:'busy'};
 const k=COINS.find(x=>x.id===cid);if(!k)return{error:'bad'};
 try{await lastPut}catch(e){}
 holdSave=true;
 let r=null;
 try{
  /* اگر محدودیت ۲ثانیه‌ای ذخیره فعال باشد، یک بار صبر و دوباره sync کن؛ هرگز با state قدیمی پول منتقل نکن. */
  let synced=false;
  for(let attempt=0;attempt<2;attempt++){
   try{
    const sync=await api('/api/state',{method:'PUT',keepalive:true,body:JSON.stringify({state:pack(),worth:worth()})});
    if(sync&&sync.ok&&!sync.skipped){synced=true;break}
    if(sync&&sync.skipped&&attempt===0){await new Promise(resolve=>setTimeout(resolve,2100));continue}
   }catch(e){break}
  }
  r=synced?await wpost('/api/wallet/cashout',{coin:cid}):{error:'sync'};
  if(r&&r.ok){S.wallet[cid]=Math.max(0,S.wallet[cid]-r.taken);S.cashed=(S.cashed||0)+r.usd;renderHUD();sfx('coin');
   if(!quiet){hapOk();centerBurst(k.col);setMood('happy',2000);toast('انتقال انجام شد · '+wnum(r.asset,r.got)+' '+(r.asset==='STAR'?'Stars':r.asset)+' به کیف پول رفت')}}
 }finally{holdSave=false}
 if(!r)return{error:'net'};
 if(r.error&&!quiet){
  if(r.error==='sync')toast('ذخیره‌ی بازی تأیید نشد؛ اتصال را بررسی کن و دوباره بزن.');
  else if(r.error==='min')toast('حداقل انتقال '+fc(r.min));
  else if(r.error==='daily')toast('سقف امروز پر شده · باقی‌مونده '+fc(r.left||0));
  else wfail(r)}
 if(!quiet){save(true);wLoad()}
 return r}

 let o=`<div class="chs">${['pending','paid','rejected'].map(s=>`<button data-act="a-wf" data-v="${s}" class="${A.wf===s?'on':''}">${ASTAT[s]}${s==='pending'&&n?` (${n})`:''}</button>`).join('')}</div>`;
 if(!A.wds)return o+'<p class="hint">در حال بارگذاری…</p>';
 if(!A.wds.length)return o+'<div class="row done">موردی نیست</div>';
 return o+A.wds.map(x=>`<div class="aitem"><div class="ah"><b>${esc(x.name)}</b><span class="pill ${x.status}">${ASTAT[x.status]||x.status}</span></div>
  <div class="am"><b class="num">${wnum(x.asset,x.amount)} ${x.asset==='STAR'?'Stars':x.asset}</b><em class="num">≈ ${fh(x.usd)}</em></div>
  <small class="num">ID ${x.uid} · ${tfmt(x.ts)}</small>
  ${x.asset!=='STAR'?`<div class="cp2"><code>${esc(x.to)}</code><button data-act="w-copy" data-v="${esc(x.to)}">کپی</button></div>`:'<small>پرداخت Stars داخل تلگرام و دستی انجام می‌شه.</small>'}
  ${x.status==='pending'?`<div class="btnrow"><button class="btn ok2" data-act="a-wd" data-id="${esc(x.id)}" data-ok="1">${icon('check','s')}پرداخت شد</button><button class="btn no2" data-act="a-wd" data-id="${esc(x.id)}" data-ok="0">${icon('close','s')}رد و برگشت وجه</button></div>`:''}</div>`).join('')}

function aUs(){
 if(A.sel)return aUser();
 let o=`<div class="srch"><input class="in" data-a="q" placeholder="نام یا آیدی عددی…" value="${esc(A.q)}" autocomplete="off"><button class="btn" data-act="a-search">جستجو</button></div>`;
 if(!A.users)return o+'<p class="hint">در حال بارگذاری…</p>';
 if(!A.users.items.length)return o+'<div class="row done">کاربری پیدا نشد</div>';
 return o+`<p class="hint">${A.q?'نتیجه‌ی جستجو':'آخرین کاربران فعال'} · کل: <span class="num">${A.users.total}</span></p>`+A.users.items.map(u=>`<div class="aitem tap" data-act="a-user" data-id="${u.id}"><div class="ah"><b>${esc(u.name)}</b>${u.banned?'<span class="pill ban">مسدود</span>':''}</div>
  <small class="num">ID ${u.id} · ثروت ${fh(u.worth)} · ${u.miners} ماینر · آخرین حضور ${tfmt(u.touch)}</small></div>`).join('')}

function aUser(){
 const u=A.sel.user,tx=A.sel.txs,ad=A.adj;
 const fg=(l,v)=>`<div><small>${l}</small><b class="num">${v}</b></div>`;
 return `<div class="fh"><button data-act="a-back">${icon('back')}</button><b>${esc(u.name)}</b>${u.banned?'<span class="pill ban">مسدود</span>':''}</div>
 <div class="fg">${fg('آیدی',u.id)}${fg('عضویت',tfmt(u.created))}${fg('بالانس بازی',f$(u.game_usd))}${fg('ثروت کل',fh(u.worth))}${fg('ماینر / قفسه',u.miners+' / '+u.shelves)}${fg('زیرمجموعه فعال',u.active_refs)}</div>
 <div class="sh"><b>کیف پول</b></div>
 <div class="fg">${fg('TON',wnum('TON',u.bal.TON))}${fg('Stars',wnum('STAR',u.bal.STAR))}${fg('USDT',wnum('USDT',u.bal.USDT))}${fg('انتقال‌شده از ماین',fh(u.cashed))}</div>
 <div class="sh"><b>تنظیم موجودی</b><small>عدد منفی = کسر</small></div>
 <div class="chs">${[['TON','TON'],['STAR','Stars'],['USDT','USDT'],['GAME','بازی']].map(a=>`<button data-act="a-adjset" data-v="${a[0]}" class="${ad.asset===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>
 <input class="in" data-a="amount" inputmode="decimal" placeholder="${ad.asset==='GAME'?'مقدار دلار هدیه به بازی':'مقدار (مثلاً 5 یا -2)'}" value="${esc(ad.amount)}" autocomplete="off">
 <input class="in fa" data-a="note" placeholder="توضیح (اختیاری)" value="${esc(ad.note)}" autocomplete="off">
 <button class="btn wide" data-act="a-adj" data-id="${u.id}">ثبت</button>
 <div class="btnrow"><button class="btn ${u.banned?'ok2':'no2'}" data-act="a-ban" data-id="${u.id}" data-v="${u.banned?0:1}">${u.banned?'رفع مسدودی':icon('lock','s')+'مسدود کردن'}</button></div>
 ${tx.length?`<div class="sh"><b>آخرین تراکنش‌ها</b></div>`+tx.map(x=>`<div class="tx"><div class="ti ${x.dir>0?'p':'m'}">${icon(x.dir>0?'dep':'wd')}</div><div class="n"><b>${esc(x.type)}</b><small class="num">${esc(x.to||ASTAT[x.status]||'')} · ${tfmt(x.ts)}</small></div>${x.amount?`<b class="num ${x.dir>0?'p':'m'}">${x.dir>0?'+':'−'}${wnum(x.asset,x.amount)} ${esc(x.asset)}</b>`:''}</div>`).join(''):''}`}

function aCf(){
 if(!A.cf)return '<p class="hint">در حال بارگذاری…</p>';
 const sw=(k,t,s)=>`<div class="fld"><span>${t}<small>${s}</small></span><button class="sw ${A.cf[k]?'on':''}" data-act="a-tog" data-v="${k}" aria-label="${t}"><i></i></button></div>`,i=A.info||{};
 return `<div class="aitem">${sw('wd_on','برداشت','درخواست برداشت کاربرها')}${sw('cashout_on','انتقال ماین به کیف پول','تبدیل ارز ماین‌شده به دارایی واقعی')}</div>
 <div class="aitem">${CFIELDS.map(f=>`<div class="fld"><span>${f[1]}<small>${f[2]}</small></span><input class="in" data-a="c:${f[0]}" inputmode="decimal" value="${esc(A.cfIn[f[0]])}"></div>`).join('')}</div>
 <button class="btn wide" data-act="a-save">ذخیره‌ی تنظیمات</button>
 <div class="sh"><b>وضعیت سرور</b></div>
 <div class="fg"><div><small>دیتابیس</small><b>${i.persistent?'دائمی':'موقت (هشدار)'}</b></div><div><small>واریز TON</small><b>${i.ton_address?'فعال':'غیرفعال'}</b></div><div><small>ارزش هر Star</small><b class="num">$${i.star_usd}</b></div><div><small>قیمت TON</small><b class="num">${i.ton_price?'$'+i.ton_price.toFixed(3):'—'}</b></div></div>
 <p class="hint">ارزش Star و آدرس واریز از Environment سرور تنظیم می‌شن.</p>`}

function aBc(){
 return `<p class="hint">پیام برای همه‌ی کاربرها (به‌جز مسدودها) با دکمه‌ی ورود به بازی فرستاده می‌شه. اول تست بگیر.</p>
 <textarea class="in fa" data-a="bc" placeholder="متن پیام…" maxlength="3000">${esc(A.bc)}</textarea>
 <div class="btnrow"><button class="btn ghost" data-act="a-bc" data-v="1">ارسال تست برای من</button><button class="btn wide" style="margin:0" data-act="a-bc" data-v="0">${icon('sound','s')}ارسال برای همه</button></div>`}

function sheetAdmin(){
 if(!IS_ADMIN)return '<div class="row done">دسترسی نداری</div>';
 const n=A.ov?A.ov.pend_n:0;
 return `<div class="atabs">${ATABS.map(t=>`<button data-act="a-tab" data-v="${t[0]}" class="${A.tab===t[0]?'on':''}">${t[1]}${t[0]==='wd'&&n?`<i class="num">${n}</i>`:''}</button>`).join('')}</div>`
  +{ov:aOv,wd:aWd,us:aUs,cf:aCf,bc:aBc}[A.tab]()}

async function aAct(a,t){
 if(!IS_ADMIN||A.busy)return;
 const v=t.dataset.v,id=t.dataset.id;
 try{
  if(a==='a-tab'){A.tab=v;A.sel=null;renderSheet();aLoad()}
  else if(a==='a-wf'){A.wf=v;A.wds=null;renderSheet();aLoad()}
  else if(a==='a-search'){A.users=null;renderSheet();aLoad()}
  else if(a==='a-back'){A.sel=null;renderSheet();aLoad()}
  else if(a==='a-user'){A.busy=true;try{A.sel=await aApi('/api/admin/user?uid='+id);A.adj={asset:'TON',amount:'',note:''}}finally{A.busy=false}renderSheet();$('#sheetBody').scrollTop=0}
  else if(a==='a-adjset'){A.adj.asset=v;renderSheet()}
  else if(a==='a-tog'){A.cf[v]=!A.cf[v];renderSheet()}
  else if(a==='a-wd'){const ok=t.dataset.ok==='1';
   if(!await askOk(ok?'تأیید پرداخت این برداشت؟ (مطمئن شو پول رو فرستادی)':'رد درخواست و برگشت وجه به کاربر؟'))return;
   A.busy=true;try{await aApi('/api/admin/withdrawals/decide','POST',{id,ok})}finally{A.busy=false}
   hapOk();toast(ok?'پرداخت ثبت شد':'رد شد و وجه برگشت');A.wds=null;A.ov=null;renderSheet();aLoad();aApi('/api/admin/overview').then(o=>{A.ov=o;aDraw()}).catch(()=>{})}
  else if(a==='a-adj'){const amt=parseFloat(A.adj.amount);if(!isFinite(amt)||amt===0)return toast('مقدار رو وارد کن');
   if(!await askOk(`${amt>0?'اضافه کردن':'کسر'} ${Math.abs(amt)} ${A.adj.asset==='GAME'?'دلار به بازی':A.adj.asset} برای این کاربر؟`))return;
   A.busy=true;try{await aApi('/api/admin/adjust','POST',{uid:+id,asset:A.adj.asset,amount:amt,note:A.adj.note})}finally{A.busy=false}
   hapOk();toast('ثبت شد');A.adj.amount='';A.adj.note='';A.sel=await aApi('/api/admin/user?uid='+id);renderSheet()}
  else if(a==='a-ban'){const b=v==='1';if(!await askOk(b?'این کاربر مسدود بشه؟':'مسدودی برداشته بشه؟'))return;
   A.busy=true;try{await aApi('/api/admin/ban','POST',{uid:+id,banned:b})}finally{A.busy=false}
   toast(b?'مسدود شد':'مسدودی برداشته شد');A.sel=await aApi('/api/admin/user?uid='+id);renderSheet()}
  else if(a==='a-save'){const c={};
   for(const f of CFIELDS){const x=parseFloat(A.cfIn[f[0]]);if(!isFinite(x)||x<0)return toast('مقدار «'+f[1]+'» نامعتبره');c[f[0]]=f[3]?x/100:x}
   c.wd_on=!!A.cf.wd_on;c.cashout_on=!!A.cf.cashout_on;
   A.busy=true;try{await aApi('/api/admin/settings','POST',{cfg:c})}finally{A.busy=false}
   hapOk();toast('تنظیمات ذخیره شد');W.lt=0;aLoad()}
  else if(a==='a-bc'){const test=v==='1';if(!A.bc.trim())return toast('متن پیام خالیه');
   if(!test&&!await askOk('این پیام برای همه‌ی کاربرها فرستاده بشه؟'))return;
   A.busy=true;let r;try{r=await aApi('/api/admin/broadcast','POST',{text:A.bc,test})}finally{A.busy=false}
   hapOk();toast(test?'تست فرستاده شد':'ارسال برای '+r.n+' نفر شروع شد');if(!test){A.bc='';renderSheet()}}
 }catch(e){A.busy=false;aErr(e)}}

document.addEventListener('input',e=>{
 const d=e.target.dataset;if(!d)return;
 if(d.w){W[d.w]=e.target.value;const q=$('#qt');if(q)q.innerHTML=W.v==='swap'?wQuote():wGmQuote();if(sheet.tab==='wallet')wVerUpd()}
 else if(d.a){const k=d.a;if(k==='q')A.q=e.target.value;else if(k==='bc')A.bc=e.target.value;else if(k==='amount'||k==='note')A.adj[k]=e.target.value;else if(k.startsWith('c:'))A.cfIn[k.slice(2)]=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='q'){e.preventDefault();e.target.blur();A.users=null;renderSheet();aLoad()}});

/* ---------------- Actions ---------------- */
const LINES_MIKO=['دارم کد می‌نویسم، نزن!','ماینرها دارن کار می‌کنن، منم کار می‌کنم!','قلقلکم نده!','من میکوام، رئیس اتاق ماینر!'];
const LINES_BUY=['ماینر جدید! صدای فن‌هاش عاشقانه‌ست','این یکی خیلی قویه، قفسه داره می‌درخشه!','سود داره بالا می‌ره، حس خوبیه'];
function centerBurst(col){const r=$('#scene').getBoundingClientRect();burst(r.left+r.width*.5,r.top+r.height*.45,col,16,4)}
function act(t,e){
 const a=t.dataset.act,id=t.dataset.id;
 if(a==='tab')openSheet(t.dataset.tab);
 else if(a==='lang-toggle'){toggleLanguage()}
 else if(a==='close')closeSheet();
 else if(a.startsWith('w-'))wAct(a,t);
 else if(a.startsWith('a-'))aAct(a,t);
 else if(a==='sel'){if(Date.now()-chipSup<700)return;S.sel=id;if(sheet.tab==='market')renderSheet();renderHUD();drawChart();hap('light')}
 else if(a==='sell'){const v=S.wallet[id]*price(id);if(v<=0)return toast('چیزی برای فروش نیست');const g=v*(Date.now()<sellBoostUntil?1.1:1);S.usd+=g;S.sold+=g;S.wallet[id]=0;flashChip(id);sfx('coin');toast('فروش '+coin(id).short+' · +'+f$(g)+(g>v?' · طوفان قیمت':''));setMood('happy');hap('medium');afterAction()}
 else if(a==='sellall'){let v=0;COINS.forEach(c=>{v+=S.wallet[c.id]*price(c.id);S.wallet[c.id]=0;flashChip(c.id)});if(v<=0)return toast('چیزی برای فروش نیست');const g=v*(Date.now()<sellBoostUntil?1.1:1);S.usd+=g;S.sold+=g;sfx('coin');toast('فروش همه · +'+f$(g)+(g>v?' · طوفان قیمت':''));setMood('happy');hap('medium');afterAction()}
 else if(a==='buy'){const m=mById(id),i=S.slots.findIndex((x,k)=>x===null&&k<cap());if(i<0)return toast('جایگاه خالی نداری! قفسه بخر');if(S.usd<m.price)return toast('پولت کافی نیست');S.usd-=m.price;S.slots[i]=id;lastBought=i;S.mb=(S.mb||0)+1;renderRack();setMood('happy',2200);hapOk();centerBurst(m.col);say(LINES_BUY[Math.floor(Math.random()*LINES_BUY.length)],4500);afterAction()}
 else if(a==='shelf'){const k=+t.dataset.k;if(k<S.shelves)openSheet('miners');else openSheet('racks')}
 else if(a==='buyshelf'){const k=+t.dataset.k;if(k!==S.shelves||S.usd<SHELF_COST[k])return;S.usd-=SHELF_COST[k];S.shelves++;renderRack();setMood('happy',2200);hapOk();centerBurst('#22e6ff');say('قفسه‌ی جدید نصب شد! جای دو ماینر دیگه باز شد',4500);afterAction()}
 else if(a==='pcup'){const n=S.pc+1;if(S.usd<PCCOST[n])return;S.usd-=PCCOST[n];S.pc=n;setMood('happy',2200);hapOk();say('کامپیوتر جدید! ضربه‌هام قوی‌تر شدن',4500);afterAction()}
 else if(a==='outfit'){const u=OUTFITS[+t.dataset.i];if(!u||S.usd<u.price)return;S.usd-=u.price;S.cos|=1<<u.id;S.co=u.id;buildRoom();renderRack();updateRoomItems();drawChart();sfx('ok');hapOk();say('چه استایلی! «'+u.n+'» تنم.',4500);setMiko('happy',2600);afterAction()}
 else if(a==='wear'){const u=OUTFITS[+t.dataset.i];if(!u||!((S.cos>>u.id)&1))return;S.co=u.id;buildRoom();renderRack();updateRoomItems();drawChart();hap('light');afterAction()}
 else if(a==='wclaim'){const i=+t.dataset.i,m=WEEKM[i];if(!m||!weekDone(i)||((S.wc>>i)&1))return;S.wc|=1<<i;S.usd+=m.rw;flyBal('+'+fc(m.rw));bumpBal();hapOk();sfx('ok');toast('ماموریت هفتگی «'+m.t+'» تموم شد · +'+fc(m.rw));afterAction();save(true)}
 else if(a==='door2'){hap('light');toast('این در به‌زودی باز می‌شه؛ اول امپراتوری زیرشیروانی رو کامل کن!')}
 else if(a==='room'){const r=ROOM.find(x=>x.id===id);if(S.usd<r.price)return;S.usd-=r.price;S.room[id]=true;updateRoomItems();setMood('happy',2200);hapOk();say(r.name+' نصب شد! اتاق قشنگ‌تر شد',4500);afterAction()}
 else if(a==='slot'){const i=+t.dataset.i;if(S.slots[i])showPop(i,t);else openSheet('miners')}
 else if(a==='popmore'){hidePop();openSheet('slot',+t.dataset.i)}
 else if(a==='popsell'){const i=+t.dataset.i,m=mById(S.slots[i]);if(!m)return;S.usd+=m.price*.6;S.slots[i]=null;renderRack();toast('ماینر فروخته شد · +'+f$(m.price*.6));hidePop();renderHUD();save(true)}
 else if(a==='sellminer'){const m=mById(S.slots[sheet.slot]);if(!m)return;S.usd+=m.price*.6;S.slots[sheet.slot]=null;renderRack();toast('ماینر فروخته شد · +'+f$(m.price*.6));closeSheet();renderHUD();save(true)}
 else if(a==='daily'){if(!dailyReady())return;const nd=dailyIdx();S.usd+=DAILY[nd];S.st=nd+1;S.dl=dayKey();flyBal('+'+fc(DAILY[nd]));bumpBal();toast('هدیه‌ی روز '+(nd+1)+' اضافه شد · +'+fc(DAILY[nd]));setMood('happy');hapOk();afterAction();save(true)}
 else if(a==='miko'){setMood('happy',2200);hap('light');say(LINES_MIKO[Math.floor(Math.random()*LINES_MIKO.length)],4500)}
 else if(a==='claimch')claimChapter()
 else if(a==='invite'){if(!REFLINK)return;const u='https://t.me/share/url?url='+encodeURIComponent(REFLINK)+'&text='+encodeURIComponent('بیا با هم تو اتاق ماینر ماین کنیم');try{tg.openTelegramLink(u)}catch(e){window.open(u,'_blank')}}
 else if(a==='copyref'){if(!REFLINK)return;try{navigator.clipboard.writeText(REFLINK).then(()=>toast('لینک کپی شد'),()=>toast(REFLINK))}catch(e){toast(REFLINK)}}
 else if(a==='boost'){boostUntil=Date.now()+30000;boostShow=0;$('#boost').classList.add('hide');hapOk();centerBurst('#ffd166');setMiko('happy',3000);toast('بوست فعال شد: ۳۰ ثانیه ماین دو برابر');renderHUD()}
 else if(a==='snd'){SND=!SND;storageSet('mr3:snd',SND?'1':'0');syncSound();if(!SND&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){};if(SND){hap('light');sfx('ok')}}
 else if(a==='top-retry'){const e2=$('#top');if(e2)e2.innerHTML='<small class="mut">در حال بارگذاری…</small>';loadTop()}
 else if(a==='ref-retry'){refTries=0;const e2=$('#ref');if(e2)e2.innerHTML='<small class="mut">در حال بارگذاری…</small>';loadRef()}
 else if(a==='evgo'){const ev=EVENTS.find(x=>x.id===id);if(!ev)return;ev.apply();$('#evbtn').classList.add('hide');evShow=0;hapOk();toast(ev.t+' فعال شد');say(ev.say,6000);checkChapter();renderHUD()}
 else if(a==='replay'){closeSheet();setTimeout(()=>playScene(S.ch),260)}
 else if(a==='sg-m'){hap('light');try{t.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.34,1.45,.4,1)'})}catch(e){}}}
function afterAction(){checkChapter();renderHUD();if(sheet.tab)renderSheet();save()}

document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-act="mine"]');if(t){e.preventDefault();mine(e)}});

/* ---------------- پاپ‌اور ماینر + بیدار کردن میکو + پن دوربین (فاز ۴) ---------------- */
function showPop(i,el){
 const m=mById(S.slots[i]);if(!m)return;
 const st=stats(),nfac=1/(1+NETD*Math.max(0,cnt()-1));
 const prod=m.y*nfac*st.bonus*RATE;
 $('#pop .pop-b').innerHTML=`<div class="pt">${coinIcon(m.coin,26)}<b>${m.name}</b></div>
  <div class="st"><span>تولید <b class="num">${frate(m.coin,prod/coin(m.coin).ref)}</b></span>
  <span>برق <b class="num">${fpw(m.pw)}/s</b></span>
  <span>ارزش فروش <b class="num">${f$(m.price*.6)}</b></span></div>
  <div class="btnrow"><button class="btn ghost" data-act="popmore" data-i="${i}">جزئیات</button><button class="btn sell" data-act="popsell" data-i="${i}">فروش</button></div>`;
 const pop=$('#pop'),sc=$('#scene').getBoundingClientRect(),r=el.getBoundingClientRect();
 pop.classList.remove('hide');
 const h=pop.offsetHeight;
 let left=r.left-sc.left+r.width/2-106;left=Math.max(8,Math.min(left,sc.width-220));
 let top=r.top-sc.top-h-12;if(top<8)top=r.bottom-sc.top+12;
 pop.style.left=left+'px';pop.style.top=top+'px';hap('light')}
function hidePop(){const p=$('#pop');if(p)p.classList.add('hide')}
/* بیدار کردن میکو با هر لمس صحنه + بستن پاپ‌اور با لمس بیرون آن */
$('#scene').addEventListener('pointerdown',e=>{
 lastTouch=Date.now();
 if(mkState==='sleep')setMiko('surprised',1300);
 if(!e.target.closest||!e.target.closest('#pop'))hidePop()},true);
/* پن افقی سبک دوربین روی صحنه با بازگشت فنری */
(function(){
 const room=$('#room');let px=null,panning=false,moved=0;
 room.addEventListener('pointerdown',e=>{px=e.clientX;panning=true;moved=0});
 room.addEventListener('pointermove',e=>{if(!panning||px===null)return;
  const dx=e.clientX-px;moved=Math.abs(dx);
  const g=document.getElementById('pan');
  if(g)g.style.transform=`translateX(${Math.max(-22,Math.min(22,dx*.55)).toFixed(1)}px)`});
 const end=()=>{if(!panning)return;panning=false;px=null;
  const g=document.getElementById('pan');
  if(g){g.style.transition='transform .45s cubic-bezier(.2,.8,.2,1)';g.style.transform='translateX(0)';
   setTimeout(()=>{if(g)g.style.transition=''},500)}};
 room.addEventListener('pointerup',end);room.addEventListener('pointercancel',end);
 room.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault();moved=0}},true);
})();

let evIn=110+Math.random()*140,evShow=0;

 b.dataset.act='evgo';b.dataset.id=ev.id;
 b.style.left=(24+Math.random()*38)+'%';b.style.top=(25+Math.random()*18)+'%';
 b.classList.remove('hide');evShow=14;evIn=200+Math.random()*220;
 hapWarn();sfx('ping')}


/* ---------------- Tick ---------------- */
let boostIn=70+Math.random()*40,boostShow=0,blackoutOn=false;
function tick(){
 simulate();
 const st=stats(),f=st.gross>0?Math.max(0,st.net)/st.gross:0;
 COINS.forEach(c=>{S.wallet[c.id]+=st.rate[c.id]*f});
 weeklyCheck();
 if(blackoutOn!==(Date.now()<blackoutUntil)){blackoutOn=Date.now()<blackoutUntil;try{$('#room').classList.toggle('blk',blackoutOn)}catch(e){}}
 mikoIdle();checkLight();evTick();if(!REDUCE&&Math.random()<.10)coinRain();if(!REDUCE&&Math.random()<.025&&parts.length<30){const [x,y]=svgToScreen(3.1,2.2);parts.push({x,y,vx:(Math.random()-.5)*.2,vy:-.3,g:0,l:1,d:.018,r:5,c:coin(S.sel).col,type:S.sel==='STAR'?'star':S.sel==='TON'?'gem':'usd',rot:Math.random()*6.28,vr:.025})}
 if(boostShow>0){if(--boostShow<=0)$('#boost').classList.add('hide')}
 else if(!boosting()&&--boostIn<=0){boostIn=90+Math.random()*60;boostShow=12;const b=$('#boost');b.style.left=(27+Math.random()*34)+'%';b.style.top=(27+Math.random()*14)+'%';b.classList.remove('hide');sfx('ping')}
 checkChapter();renderHUD();drawChart();updateLive()}

document.addEventListener('visibilitychange',syncMotion);
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.onEvent('activated',()=>{document.documentElement.classList.remove('tg-inactive');syncMotion()});Telegram.WebApp.onEvent('deactivated',()=>{document.documentElement.classList.add('tg-inactive');syncMotion()})}}catch(e){}

function updateDailyCountdown(){
 const el=$('#dailyTimer');if(!el)return;
 const now=Date.now(),next=Math.floor(now/86400000+1)*86400000,left=Math.max(0,next-now);
 const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),sec=Math.floor(left%60000/1000);
 el.textContent=[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')+' UTC'
}
setInterval(updateDailyCountdown,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateDailyCountdown()});
